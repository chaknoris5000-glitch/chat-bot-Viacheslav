    <script>
        // ДВА НАБОРА КЛЮЧЕЙ
        const TILDA_URL = 'https://ozutjnwextahorvzdbpl.supabase.co';
        const TILDA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im96dXRqbndleHRhaG9ydnpkYnBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MTQ3MzUsImV4cCI6MjEwNzE5MDczNX0.8L3adhQ9gUR5iSly1afSQN6HeEhkj9QQ4NtUyZUQx28';
        
        const LOANS_URL = 'https://ggmshdfplrqsybnchvha.supabase.co';
        const LOANS_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdnbXNoZGZwbHJxc3libmNodmhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3MDA4MTUsImV4cCI6MjEwNzI3NjgxNX0.BXfy8ECjzp1g0-uuM_CeXOOB46fWm9KD7VERSX8tYJs';

        const ADMIN_TELEGRAM_ID = 5818548555; 
        
        let allLeads = [];
        let currentLeadId = null;
        let currentUserTgId = null;
        let currentListStatus = 'all';
        
        let SUPABASE_URL = TILDA_URL;
        let SUPABASE_KEY = TILDA_KEY;

        // AUTH
        function onTelegramAuth(user) {
            fetch('/auth/telegram', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(user)
            }).then(res => res.json()).then(data => {
                if (data.ok) window.location.href = `/crm?auth_success=1&telegram_id=${data.telegram_id}`;
            });
        }

        async function checkAuth() {
            const urlParams = new URLSearchParams(window.location.search);
            
            if (urlParams.get('telegram_id')) {
                currentUserTgId = Number(urlParams.get('telegram_id'));
            } else {
                try {
                    if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe?.user) {
                        currentUserTgId = window.Telegram.WebApp.initDataUnsafe.user.id;
                    }
                } catch (e) {}
            }
            
            if (currentUserTgId) {
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('crm-container').style.display = 'flex';
                
                if (urlParams.get('view_client')) {
                    window.currentClientId = urlParams.get('view_client');
                }

                const isAdmin = currentUserTgId === ADMIN_TELEGRAM_ID;
                if (isAdmin && (!window.currentClientId || window.currentClientId === 'tilda')) {
                    SUPABASE_URL = TILDA_URL;
                    SUPABASE_KEY = TILDA_KEY;
                } else {
                    SUPABASE_URL = LOANS_URL;
                    SUPABASE_KEY = LOANS_KEY;
                }
                
                loadLeads();
            }
        }
        window.onload = checkAuth;

        // DATA
        async function loadLeads() {
            try {
                let data = [];
                
                if (window.currentClientId) {
                    const res = await fetch(`${LOANS_URL}/rest/v1/leads?select=*&order=id.desc&client_id=eq.${window.currentClientId}`, {
                        headers: { 'apikey': LOANS_KEY, 'Authorization': `Bearer ${LOANS_KEY}` }
                    });
                    data = await res.json();
                } 
                else if (currentUserTgId === ADMIN_TELEGRAM_ID) {
                    const res = await fetch(`${TILDA_URL}/rest/v1/leads?select=*&order=id.desc`, {
                        headers: { 'apikey': TILDA_KEY, 'Authorization': `Bearer ${TILDA_KEY}` }
                    });
                    data = await res.json();
                }
                else {
                    const clientRes = await fetch(`${LOANS_URL}/rest/v1/clients?owner_telegram_id=eq.${currentUserTgId}&select=client_id`, {
                        headers: { 'apikey': LOANS_KEY, 'Authorization': `Bearer ${LOANS_KEY}` }
                    });
                    const clients = await clientRes.json();
                    
                    if (Array.isArray(clients) && clients.length > 0) {
                        const myClientId = clients[0].client_id;
                        const urlParams = new URLSearchParams(window.location.search);
                        if (urlParams.get('view_client') && urlParams.get('view_client') !== myClientId) {
                            data = [];
                        } else {
                            const res = await fetch(`${LOANS_URL}/rest/v1/leads?select=*&order=id.desc&client_id=eq.${myClientId}`, {
                                headers: { 'apikey': LOANS_KEY, 'Authorization': `Bearer ${LOANS_KEY}` }
                            });
                            data = await res.json();
                        }
                    } else {
                        data = [];
                    }
                }
                
                if (!Array.isArray(data)) data = [];
                
                allLeads = data;
                updateStats(allLeads);
                renderKanban(allLeads);
                renderList(allLeads);
                renderClientBase(allLeads);
                renderTasks(allLeads);
                populateTaskClientSelect(allLeads);
            } catch (e) { 
                console.error(e); 
                allLeads = [];
                updateStats(allLeads);
            }
        }

        // RENDER
        function updateStats(data) {
            document.getElementById('stat-total').innerText = data.length;
            document.getElementById('stat-progress').innerText = data.filter(l => l.status === 'in_progress').length;
            document.getElementById('stat-closed').innerText = data.filter(l => l.status === 'closed').length;
            document.getElementById('stat-archive').innerText = data.filter(l => l.status === 'archived').length;
        }

        function renderKanban(data) {
            const board = document.getElementById('kanban-view');
            board.innerHTML = '';
            const columns = [
                { id: 'new', title: 'Новые' }, 
                { id: 'in_progress', title: 'В работе' }, 
                { id: 'closed', title: 'Выполнено' }
            ];

            columns.forEach(col => {
                const colLeads = data.filter(l => l.status === col.id);
                const totalSum = colLeads.reduce((acc, curr) => acc + (Number(curr.amount) || 0), 0);
                
                const colEl = document.createElement('div');
                colEl.className = 'kanban-col';
                colEl.innerHTML = `<div class="col-header"><span>${col.title} (${colLeads.length})</span><span style="color:var(--success);">${totalSum > 0 ? totalSum.toLocaleString() + ' ₽' : ''}</span></div>`;

                colLeads.forEach(lead => {
                    const card = document.createElement('div');
                    card.className = 'kanban-card';
                    card.onclick = () => openClientModal(lead.id);
                    
                    let actionBtn = '';
                    if (col.id === 'new') {
                        actionBtn = `<button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); changeStatusFromCard(${lead.id}, 'in_progress')">→ В работу</button>`;
                    } else if (col.id === 'in_progress') {
                        actionBtn = `
                            <div style="display:flex; gap:5px;">
                                <button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); changeStatusFromCard(${lead.id}, 'new')">← Новые</button>
                                <button class="btn btn-outline btn-sm mobile-small-btn" onclick="event.stopPropagation(); changeStatusFromCard(${lead.id}, 'closed')">→ Выполн.</button>
                            </div>
                        `;
                    } else if (col.id === 'closed') {
                        actionBtn = `
                            <div style="display:flex; gap:5px;">
                                <button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); changeStatusFromCard(${lead.id}, 'in_progress')">← В работу</button>
                                <button class="btn btn-outline btn-sm" style="color:var(--danger);" onclick="event.stopPropagation(); archiveFromKanban(${lead.id})">📦 В архив</button>
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <div class="k-title"><span>${lead.name || 'Без имени'}</span><span class="k-amount">${lead.amount ? lead.amount + ' ₽' : ''}</span></div>
                        <div class="k-phone">${lead.phone || (lead.phones && lead.phones[0]) || '—'}</div>
                        <div class="k-tags">${lead.service ? `<span class="k-tag">${lead.service}</span>` : ''}<span class="k-tag">#${lead.id}</span></div>
                        <div class="k-actions" style="justify-content: flex-end; gap: 5px;">
                            ${actionBtn}
                        </div>
                    `;
                    colEl.appendChild(card);
                });
                board.appendChild(colEl);
            });
        }

        function renderList(data) {
            const tbody = document.getElementById('leadsBody');
            tbody.innerHTML = '';
            
            const dateVal = document.getElementById('list-filter-date').value;
            const searchVal = document.getElementById('list-filter-search').value.toLowerCase();
            
            let filtered = data.filter(l => {
                if (currentListStatus !== 'all' && l.status !== currentListStatus) return false;
                if (dateVal && !l.created_at.startsWith(dateVal)) return false;
                if (searchVal && !(l.name||'').toLowerCase().includes(searchVal) && !(l.phone||'').includes(searchVal)) return false;
                return true;
            });

            filtered.forEach(lead => {
                const tr = document.createElement('tr');
                tr.onclick = () => openClientModal(lead.id);
                tr.innerHTML = `
                    <td style="color:#94a3b8;">#${lead.id}</td>
                    <td style="font-weight:600;">${lead.name || '—'}</td>
                    <td>${lead.phone || '—'}</td>
                    <td>${lead.service || '—'}</td>
                    <td style="font-weight:700; color:var(--success);">${lead.amount ? lead.amount + ' ₽' : '—'}</td>
                    <td>${new Date(lead.created_at).toLocaleDateString('ru-RU')}</td>
                    <td>${lead.status}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderClientBase(data) {
            const tbody = document.getElementById('clientsBaseBody');
            tbody.innerHTML = '';

            const uniqueClients = {};
            data.forEach(lead => {
                const phone = lead.phone || (lead.phones && lead.phones[0]) || 'unknown';
                if (!uniqueClients[phone]) {
                    uniqueClients[phone] = { ...lead, allServices: [], lastDate: lead.created_at };
                }
                if (lead.service && !uniqueClients[phone].allServices.includes(lead.service)) uniqueClients[phone].allServices.push(lead.service);
                if (lead.created_at > uniqueClients[phone].lastDate) uniqueClients[phone].lastDate = lead.created_at;
            });

            const clientsArray = Object.values(uniqueClients);

            const nameVal = document.getElementById('client-filter-name').value.toLowerCase();
            const phoneVal = document.getElementById('client-filter-phone').value;
            const dateVal = document.getElementById('client-filter-date').value;

            const filtered = clientsArray.filter(c => {
                if (nameVal && !(c.name||'').toLowerCase().includes(nameVal)) return false;
                if (phoneVal && !(c.phone||'').includes(phoneVal)) return false;
                if (dateVal && !c.lastDate.startsWith(dateVal)) return false;
                return true;
            });

            filtered.forEach(client => {
                const tr = document.createElement('tr');
                tr.onclick = () => openClientModal(client.id);
                tr.innerHTML = `
                    <td style="font-weight:600;">${client.name || '—'}</td>
                    <td>${client.phone || '—'}</td>
                    <td>${client.allServices.join(', ') || '—'}</td>
                    <td style="color:var(--success);">${client.amount ? client.amount + ' ₽' : '—'}</td>
                    <td>${new Date(client.lastDate).toLocaleDateString('ru-RU')}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderTasks(data) {
            const tbody = document.getElementById('tasksBody');
            tbody.innerHTML = '';
            const tasks = data.filter(l => l.next_contact_date);
            document.getElementById('task-count').innerText = tasks.length;
            if(tasks.length > 0) document.getElementById('task-count').style.display = 'inline-block';

            tasks.forEach(lead => {
                const date = new Date(lead.next_contact_date).toLocaleString('ru-RU');
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${lead.notes || 'Перезвонить'}</td>
                    <td>${lead.name} (${lead.phone})</td>
                    <td style="color: var(--danger); font-weight: 600;">${date}</td>
                    <td><button class="btn btn-outline btn-sm" onclick="openClientModal(${lead.id})">Открыть</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // --- СТАТУСЫ И КАРТОЧКА ---
        function updateStatusUI(status) {
            const badge = document.getElementById('current-status-badge');
            const buttons = document.getElementById('status-buttons');
            buttons.innerHTML = '';

            if (status === 'new') {
                badge.className = 'current-status status-new';
                badge.innerText = 'Статус: Новая';
                buttons.innerHTML = `<button class="btn btn-primary btn-sm" onclick="changeStatusFromCard('in_progress')">Взять в работу</button>`;
            } else if (status === 'in_progress') {
                badge.className = 'current-status status-progress';
                badge.innerText = 'Статус: В работе';
                buttons.innerHTML = `<button class="btn btn-primary btn-sm" style="background:var(--success);" onclick="changeStatusFromCard('closed')">Выполнено</button>`;
            } else if (status === 'closed') {
                badge.className = 'current-status status-closed';
                badge.innerText = 'Статус: Выполнено';
            } else if (status === 'archived') {
                badge.className = 'current-status status-archived';
                badge.innerText = 'Статус: В архиве';
                buttons.innerHTML = `<button class="btn btn-outline btn-sm" onclick="changeStatusFromCard('new')">Вернуть в новые</button>`;
            }
        }

        async function changeStatusFromCard(id, newStatus) {
            await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${id}`, {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            closeModal();
            loadLeads();
        }

        async function archiveFromKanban(id) {
            await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${id}`, {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: 'archived' })
            });
            loadLeads();
        }

        function openClientModal(id) {
            const lead = allLeads.find(l => l.id === id);
            if (!lead) return;
            currentLeadId = id;
            document.getElementById('edit-id').innerText = `#${id}`;
            document.getElementById('edit-name').value = lead.name || '';
            document.getElementById('edit-amount').value = lead.amount || '';
            document.getElementById('edit-paid').value = lead.is_paid ? 'true' : 'false';
            document.getElementById('edit-notes').value = lead.notes || lead.problem || '';

            document.getElementById('phones-container').innerHTML = '';
            document.getElementById('services-container').innerHTML = '';

            const phones = lead.phones && lead.phones.length > 0 ? lead.phones : (lead.phone ? [lead.phone] : ['']);
            phones.forEach(p => addPhoneField(p));

            const services = lead.services && lead.services.length > 0 ? lead.services : (lead.service ? [lead.service] : ['']);
            services.forEach(s => addServiceField(s));

            updateStatusUI(lead.status);

            const cleanPhone = (lead.phone || '').replace(/\D/g, '');
            document.getElementById('btn-call').href = `tel:${lead.phone || ''}`;
            document.getElementById('btn-tg').href = cleanPhone.length > 5 ? `https://t.me/+${cleanPhone}` : '#';

            if (lead.email) {
                document.getElementById('btn-email').href = `mailto:${lead.email}`;
                document.getElementById('btn-email').style.opacity = '1';
            } else {
                document.getElementById('btn-email').removeAttribute('href');
                document.getElementById('btn-email').style.opacity = '0.5';
            }

            if (currentUserTgId === ADMIN_TELEGRAM_ID) {
                if (lead.client_id && lead.client_id !== 'tilda') {
                    document.getElementById('create-bot-fields').style.display = 'none';
                    document.getElementById('widget-download-container').style.display = 'block';
                } else {
                    document.getElementById('create-bot-fields').style.display = 'block';
                    document.getElementById('widget-download-container').style.display = 'none';
                    document.getElementById('bot-client-id').value = '';
                    document.getElementById('bot-business-name').value = '';
                    document.getElementById('bot-site-url').value = '';
                    document.getElementById('bot-token').value = '';
                    document.getElementById('bot-owner-id').value = '';
                }
            } else {
                document.getElementById('bot-creation-block').style.display = 'none';
            }
            
            document.getElementById('clientModal').style.display = 'flex';
        }

        function addPhoneField(value = '') {
            const container = document.getElementById('phones-container');
            const div = document.createElement('div');
            div.style.display = 'flex'; div.style.gap = '8px';
            div.innerHTML = `
                <input type="text" class="dynamic-phone" value="${value}" placeholder="+7..." style="flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:6px;">
                <button class="btn btn-danger btn-sm" type="button" onclick="this.parentElement.remove()" style="padding:0 10px;">✕</button>
            `;
            container.appendChild(div);
        }

        function addServiceField(value = '') {
            const container = document.getElementById('services-container');
            const div = document.createElement('div');
            div.style.display = 'flex'; div.style.gap = '8px';
            div.innerHTML = `
                <input type="text" class="dynamic-service" value="${value}" placeholder="Услуга" style="flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:6px;">
                <button class="btn btn-danger btn-sm" type="button" onclick="this.parentElement.remove()" style="padding:0 10px;">✕</button>
            `;
            container.appendChild(div);
        }

        function closeModal() { document.getElementById('clientModal').style.display = 'none'; }

        async function saveLead() {
            const phones = Array.from(document.querySelectorAll('.dynamic-phone')).map(i => i.value.trim()).filter(v => v);
            const services = Array.from(document.querySelectorAll('.dynamic-service')).map(i => i.value.trim()).filter(v => v);

            const updates = {
                name: document.getElementById('edit-name').value.trim(),
                phones: phones, services: services,
                phone: phones[0] || null, service: services[0] || null,
                amount: Number(document.getElementById('edit-amount').value) || 0,
                is_paid: document.getElementById('edit-paid').value === 'true',
                notes: document.getElementById('edit-notes').value.trim()
            };
            await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${currentLeadId}`, {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify(updates)
            });
            closeModal(); loadLeads();
        }

        async function archiveLead() {
            const reason = prompt('Укажите причину переноса в архив:');
            if (reason === null) return; 
            await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${currentLeadId}`, {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: 'archived', archive_reason: reason || 'Без причины' })
            });
            closeModal(); loadLeads();
        }

        async function deleteLead() {
            if (!confirm('Удалить заявку?')) return;
            await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${currentLeadId}`, {
                method: 'DELETE',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            });
            closeModal(); loadLeads();
        }

        function copyTemplate() {
            const name = document.getElementById('edit-name').value || 'Клиент';
            navigator.clipboard.writeText(`Здравствуйте, ${name}! Спасибо за обращение. Наш менеджер свяжется с вами в ближайшее время.`);
            alert('Шаблон скопирован!');
        }

        // TASKS
        function populateTaskClientSelect(data) {
            const select = document.getElementById('task-client-id');
            select.innerHTML = '<option value="">Выберите клиента...</option>';
            data.forEach(l => { select.innerHTML += `<option value="${l.id}">${l.name || 'Без имени'} (${l.phone || '—'})</option>`; });
        }

        function openTaskModal() { document.getElementById('taskModal').style.display = 'flex'; }
        function closeTaskModal() { document.getElementById('taskModal').style.display = 'none'; }

        async function saveTask() {
            const id = document.getElementById('task-client-id').value;
            const text = document.getElementById('task-text').value;
            const date = document.getElementById('task-date').value;
            if (!id || !text || !date) return alert('Заполните все поля');

            await fetch(`${SUPABASE_URL}/rest/v1/leads?id=eq.${id}`, {
                method: 'PATCH',
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ next_contact_date: date, notes: text })
            });
            closeTaskModal(); loadLeads(); switchTab('tasks');
        }

        // TABS
        function switchTab(tab) {
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.main-content > div:not(.header-actions-mobile)').forEach(el => el.style.display = 'none');
            document.getElementById('stats-block').style.display = 'grid';
            if (tab === 'kanban') {
                document.querySelectorAll('.menu-item')[0].classList.add('active');
                document.getElementById('page-title').innerText = 'Воронка продаж';
                document.getElementById('kanban-view').style.display = 'flex';
            } else if (tab === 'list') {
                document.querySelectorAll('.menu-item')[1].classList.add('active');
                document.getElementById('page-title').innerText = 'Все заявки';
                document.getElementById('list-view').style.display = 'block';
            } else if (tab === 'clients') {
                document.querySelectorAll('.menu-item')[2].classList.add('active');
                document.getElementById('page-title').innerText = 'База клиентов';
                document.getElementById('clients-view').style.display = 'block';
            } else if (tab === 'tasks') {
                document.querySelectorAll('.menu-item')[3].classList.add('active');
                document.getElementById('page-title').innerText = 'Задачи и напоминания';
                document.getElementById('tasks-view').style.display = 'block';
            } else {
                document.querySelectorAll('.menu-item')[4].classList.add('active');
                document.getElementById('page-title').innerText = 'Настройки';
                document.getElementById('settings-view').style.display = 'block';
            }
        }

        function filterLeadsByStatus(status, btn) {
            currentListStatus = status;
            document.querySelectorAll('.filters-bar .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            applyListFilters();
        }

        function applyListFilters() { renderList(allLeads); }
        function applyClientBaseFilters() { renderClientBase(allLeads); }

        // EXPORT & CREATE
        function exportToExcel() {
            if (allLeads.length === 0) return alert('Нет данных');
            const ws_data = [["ID", "Дата", "Имя", "Телефон", "Услуга", "Сумма", "Оплачено", "Статус"]];
            allLeads.forEach(l => {
                ws_data.push([l.id, new Date(l.created_at).toLocaleString('ru-RU'), l.name || '', l.phone || '', l.service || '', l.amount || 0, l.is_paid ? 'Да' : 'Нет', l.status]);
            });
            const ws = XLSX.utils.aoa_to_sheet(ws_data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Заявки");
            XLSX.writeFile(wb, "leads_export.xlsx");
        }

        function openCreateModal() { document.getElementById('createModal').style.display = 'flex'; }
        function closeCreateClientModal() { document.getElementById('createModal').style.display = 'none'; }

        async function submitNewClient() {
            const client_id = document.getElementById('newClientId').value.trim();
            const business_name = document.getElementById('newBusinessName').value.trim();
            const site_url = document.getElementById('newSiteUrl').value.trim();
            const bot_token = document.getElementById('newBotToken').value.trim();
            const owner_telegram_id = document.getElementById('newOwnerId').value.trim();
            const timezone = document.getElementById('newTimezone').value;
            if (!client_id || !business_name || !site_url || !bot_token) return alert('Заполните все поля!');

            try {
                const res = await fetch('/api/create-client', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
